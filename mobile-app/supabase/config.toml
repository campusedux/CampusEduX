# Minimal Supabase CLI config. `supabase link --project-ref <ref>` fills in the
# rest; `supabase db reset` / `supabase start` need at least this file to exist.
project_id = "campusedux"

[db]
major_version = 15

[functions.create-razorpay-order]
verify_jwt = true

[functions.verify-razorpay-payment]
verify_jwt = true

[functions.create-premium-order]
verify_jwt = true

[functions.verify-premium-payment]
verify_jwt = true

[functions.create-wallet-topup-order]
verify_jwt = true

[functions.verify-wallet-topup-payment]
verify_jwt = true

[functions.create-custom-project-order]
verify_jwt = true

[functions.verify-custom-project-payment]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
