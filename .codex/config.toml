# Native CampusEduX project configuration; original Claude configuration is unchanged.
# Neither endpoint may be contacted until the user approves enabling it.

[features]
hooks = false

# Claude per-agent tool allowlists have no equivalent native role field.
# Keep invocation disabled until restrictions and read-only parent usage are reviewed.
[agents]
enabled = false
max_concurrent_threads_per_session = 3

[mcp_servers.github]
enabled = false
url = "https://api.githubcopilot.com/mcp/"
http_headers = { "X-MCP-Toolsets" = "context,issues,pull_requests,repos,users", "X-MCP-Lockdown" = "true" }

[mcp_servers.supabase]
enabled = false
url = "https://mcp.supabase.com/mcp?project_ref=oqwjooaapsotnncmhvtk&read_only=true&features=database%2Cdocs"

# Existing local installation; isolated, sandboxed Chromium without downloads.
[mcp_servers.playwright]
enabled = true
command = "node"
args = ["/home/ganeshp8545/CampusEduX/build/playwright-mcp-phase7/node_modules/@playwright/mcp/cli.js", "--headless", "--sandbox", "--isolated", "--image-responses", "omit", "--idle-timeout", "300000", "--executable-path", "/home/ganeshp8545/CampusEduX/build/playwright-mcp-phase7/browsers/chromium_headless_shell-1247/chrome-headless-shell-linux64/chrome-headless-shell", "--output-dir", "/tmp/campusedux-playwright-qa", "--viewport-size", "1440x900"]
cwd = "/home/ganeshp8545/CampusEduX"
env = { PLAYWRIGHT_BROWSERS_PATH = "/home/ganeshp8545/CampusEduX/build/playwright-mcp-phase7/browsers" }
