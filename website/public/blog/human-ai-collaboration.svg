<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Two interlocking puzzle pieces — one plain, one patterned with circuit lines — representing people and AI working as one team">
  <defs>
    <linearGradient id="colBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="colHuman" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#4F39F6"/>
    </linearGradient>
    <linearGradient id="colAI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4429EA"/><stop offset="1" stop-color="#3A20CE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#colBg)"/>
  <circle cx="600" cy="338" r="250" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- left puzzle piece (human) -->
  <path d="M300 190
           h190
           a40 40 0 0 1 0 80 h30 a40 40 0 0 1 0 -0
           v-0
           a44 44 0 0 1 0 88
           h-30 a40 40 0 0 0 0 80
           h-190 z" fill="url(#colHuman)"/>
  <g transform="translate(372 300)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-22" r="16" fill="#FFFFFF" stroke="none"/>
    <path d="M-30 60 c0 -40 60 -40 60 0"/>
  </g>

  <!-- right puzzle piece (AI) -->
  <path d="M900 190
           h-190
           a40 40 0 0 0 0 80 h-30 a44 44 0 0 0 0 88
           h30 a40 40 0 0 1 0 80
           h190 z" fill="url(#colAI)"/>
  <g transform="translate(770 240)" stroke="#A5A9FC" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M20 20 h60 v50 h50 M40 110 h70 v-40 M110 20 v40"/>
  </g>
  <g transform="translate(770 240)" fill="#FFFFFF">
    <circle cx="20" cy="20" r="8"/><circle cx="80" cy="70" r="8"/><circle cx="130" cy="70" r="8"/><circle cx="40" cy="110" r="8"/><circle cx="110" cy="30" r="8"/>
  </g>

  <!-- seam glow -->
  <line x1="600" y1="150" x2="600" y2="530" stroke="#FBBF24" stroke-width="4" stroke-opacity="0.55" stroke-dasharray="4 14" stroke-linecap="round"/>
</svg>
