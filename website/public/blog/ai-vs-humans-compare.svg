<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A balanced scale weighing a computer chip against a lightbulb, showing that AI strengths and human strengths are different but complementary">
  <defs>
    <linearGradient id="cmpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7FF"/><stop offset="1" stop-color="#ECEFFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cmpBg)"/>

  <!-- stand -->
  <rect x="576" y="150" width="48" height="380" rx="12" fill="#C7CBFE"/>
  <rect x="470" y="520" width="260" height="40" rx="16" fill="#8480F9"/>
  <circle cx="600" cy="150" r="26" fill="#4F39F6"/>

  <!-- beam -->
  <rect x="270" y="138" width="660" height="24" rx="12" fill="#4F39F6" transform="rotate(-4 600 150)"/>

  <!-- left pan: AI chip -->
  <g transform="translate(340 250)">
    <path d="M0 0 L120 0 L150 90 A70 40 0 0 1 -30 90 Z" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="3"/>
    <line x1="60" y1="-108" x2="8" y2="0" stroke="#8480F9" stroke-width="4"/>
    <line x1="60" y1="-108" x2="112" y2="0" stroke="#8480F9" stroke-width="4"/>
    <g transform="translate(60 60)">
      <rect x="-34" y="-34" width="68" height="68" rx="12" fill="#EEF0FF" stroke="#4F39F6" stroke-width="5"/>
      <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#4F39F6"/>
      <g stroke="#4F39F6" stroke-width="5" stroke-linecap="round">
        <path d="M-34 -16 h-14 M-34 0 h-14 M-34 16 h-14 M34 -16 h14 M34 0 h14 M34 16 h14"/>
        <path d="M-16 -34 v-14 M0 -34 v-14 M16 -34 v-14 M-16 34 v14 M0 34 v14 M16 34 v14"/>
      </g>
    </g>
  </g>

  <!-- right pan: human idea -->
  <g transform="translate(740 300)">
    <path d="M0 0 L120 0 L150 90 A70 40 0 0 1 -30 90 Z" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="3"/>
    <line x1="60" y1="-158" x2="8" y2="0" stroke="#8480F9" stroke-width="4"/>
    <line x1="60" y1="-158" x2="112" y2="0" stroke="#8480F9" stroke-width="4"/>
    <g transform="translate(60 52)">
      <path d="M0 -40 C34 -40 52 -16 44 12 C40 26 28 32 26 46 L-26 46 C-28 32 -40 26 -44 12 C-52 -16 -34 -40 0 -40 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="5"/>
      <rect x="-18" y="50" width="36" height="12" rx="6" fill="#F59E0B"/>
      <rect x="-12" y="66" width="24" height="10" rx="5" fill="#F59E0B"/>
      <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round"><path d="M0 -60 v-14 M40 -44 l10 -10 M-40 -44 l-10 -10"/></g>
    </g>
  </g>
</svg>
