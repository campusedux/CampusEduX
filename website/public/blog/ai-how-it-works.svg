<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Diagram of a neural network learning from data: an input layer, two hidden layers and an output">
  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7FF"/>
      <stop offset="1" stop-color="#ECEFFF"/>
    </linearGradient>
    <linearGradient id="hwNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8480F9"/>
      <stop offset="1" stop-color="#4F39F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hwBg)"/>

  <!-- edges -->
  <g stroke="#4F39F6" stroke-opacity="0.18" stroke-width="2">
    <g>
      <line x1="230" y1="150" x2="470" y2="130"/><line x1="230" y1="150" x2="470" y2="260"/><line x1="230" y1="150" x2="470" y2="390"/><line x1="230" y1="150" x2="470" y2="520"/>
      <line x1="230" y1="290" x2="470" y2="130"/><line x1="230" y1="290" x2="470" y2="260"/><line x1="230" y1="290" x2="470" y2="390"/><line x1="230" y1="290" x2="470" y2="520"/>
      <line x1="230" y1="430" x2="470" y2="130"/><line x1="230" y1="430" x2="470" y2="260"/><line x1="230" y1="430" x2="470" y2="390"/><line x1="230" y1="430" x2="470" y2="520"/>
      <line x1="230" y1="560" x2="470" y2="130"/><line x1="230" y1="560" x2="470" y2="260"/><line x1="230" y1="560" x2="470" y2="390"/><line x1="230" y1="560" x2="470" y2="520"/>
    </g>
    <g>
      <line x1="470" y1="130" x2="720" y2="200"/><line x1="470" y1="130" x2="720" y2="340"/><line x1="470" y1="130" x2="720" y2="480"/>
      <line x1="470" y1="260" x2="720" y2="200"/><line x1="470" y1="260" x2="720" y2="340"/><line x1="470" y1="260" x2="720" y2="480"/>
      <line x1="470" y1="390" x2="720" y2="200"/><line x1="470" y1="390" x2="720" y2="340"/><line x1="470" y1="390" x2="720" y2="480"/>
      <line x1="470" y1="520" x2="720" y2="200"/><line x1="470" y1="520" x2="720" y2="340"/><line x1="470" y1="520" x2="720" y2="480"/>
    </g>
    <g stroke-opacity="0.32" stroke-width="3">
      <line x1="720" y1="200" x2="960" y2="338"/><line x1="720" y1="340" x2="960" y2="338"/><line x1="720" y1="480" x2="960" y2="338"/>
    </g>
  </g>

  <!-- input layer (data) -->
  <g>
    <rect x="120" y="120" width="60" height="60" rx="12" fill="#C7CBFE"/>
    <rect x="120" y="260" width="60" height="60" rx="12" fill="#C7CBFE"/>
    <rect x="120" y="400" width="60" height="60" rx="12" fill="#C7CBFE"/>
    <rect x="120" y="530" width="60" height="60" rx="12" fill="#C7CBFE"/>
  </g>

  <!-- hidden layers -->
  <g fill="url(#hwNode)">
    <circle cx="470" cy="130" r="26"/><circle cx="470" cy="260" r="26"/><circle cx="470" cy="390" r="26"/><circle cx="470" cy="520" r="26"/>
    <circle cx="720" cy="200" r="26"/><circle cx="720" cy="340" r="26"/><circle cx="720" cy="480" r="26"/>
  </g>

  <!-- output -->
  <g transform="translate(960 338)">
    <circle r="46" fill="#FFFFFF"/>
    <circle r="34" fill="#3A20CE"/>
    <path d="M-14 0 l9 10 l18 -20" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- feedback arrow (learning loop) -->
  <path d="M960 470 q-360 150 -740 0" stroke="#16A34A" stroke-opacity="0.5" stroke-width="4" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M232 470 l-14 -8 l4 18 z" fill="#16A34A" fill-opacity="0.6"/>
</svg>
