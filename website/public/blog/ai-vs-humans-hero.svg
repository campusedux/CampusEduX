<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Two profiles face each other — one drawn with circuit lines, one organic — meeting at a bright spark, suggesting people and AI working together">
  <defs>
    <linearGradient id="vhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/><stop offset="0.5" stop-color="#F3F1FF"/><stop offset="1" stop-color="#E7ECFF"/>
    </linearGradient>
    <linearGradient id="vhHuman" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F39F6"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="vhAI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A20CE"/><stop offset="1" stop-color="#4F39F6"/>
    </linearGradient>
    <radialGradient id="vhSpark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="0.4" stop-color="#F59E0B" stop-opacity="0.6"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#vhBg)"/>

  <!-- left: human profile -->
  <g transform="translate(430 338)">
    <path d="M-210 200 C-230 60 -150 -190 40 -196 C-30 -150 -60 -70 -46 -8 C-36 40 -84 70 -70 120 C-60 156 -110 176 -96 210 Z" fill="url(#vhHuman)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M-150 -30 q40 -50 90 -20 q40 24 10 70 q-30 40 10 74"/>
      <circle cx="-70" cy="-40" r="10" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- right: AI profile (circuit) -->
  <g transform="translate(770 338) scale(-1 1)">
    <path d="M-210 200 C-230 60 -150 -190 40 -196 C-30 -150 -60 -70 -46 -8 C-36 40 -84 70 -70 120 C-60 156 -110 176 -96 210 Z" fill="url(#vhAI)"/>
    <g stroke="#A5A9FC" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-150 -20 h50 v40 h44 M-120 60 h70 v-40"/>
      <path d="M-60 -70 v40 h40"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="-100" cy="-20" r="8"/><circle cx="-56" cy="20" r="8"/><circle cx="-50" cy="-70" r="8"/><circle cx="-20" cy="-30" r="8"/><circle cx="-50" cy="60" r="8"/>
    </g>
  </g>

  <!-- meeting spark -->
  <circle cx="600" cy="330" r="150" fill="url(#vhSpark)"/>
  <g transform="translate(600 330)">
    <path d="M-8 -46 L6 -12 L40 -6 L14 16 L20 50 L-8 30 L-38 48 L-30 12 L-54 -10 L-20 -14 Z" fill="#F59E0B"/>
    <path d="M-8 -46 L6 -12 L40 -6 L14 16 L20 50 L-8 30 Z" fill="#FBBF24"/>
  </g>
</svg>
