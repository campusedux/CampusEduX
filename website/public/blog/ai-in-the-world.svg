<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A grid of tiles representing where AI is used: conversation, healthcare, code, transport, security and analytics">
  <defs>
    <linearGradient id="wBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/><stop offset="1" stop-color="#EFECFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#wBg)"/>
  <circle cx="600" cy="338" r="240" fill="#4F39F6" fill-opacity="0.06"/>

  <g stroke="#4F39F6" stroke-opacity="0.16" stroke-width="2">
    <line x1="600" y1="338" x2="300" y2="170"/><line x1="600" y1="338" x2="900" y2="170"/>
    <line x1="600" y1="338" x2="220" y2="400"/><line x1="600" y1="338" x2="980" y2="400"/>
    <line x1="600" y1="338" x2="430" y2="540"/><line x1="600" y1="338" x2="770" y2="540"/>
  </g>

  <g transform="translate(600 338)">
    <circle r="70" fill="#FFFFFF"/>
    <circle r="52" fill="#4F39F6"/>
    <g stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round">
      <circle r="20"/><path d="M-40 0 h14 M26 0 h14 M0 -40 v14 M0 26 v14"/>
    </g>
  </g>

  <!-- tiles -->
  <g>
    <!-- conversation -->
    <g transform="translate(230 100)">
      <rect width="140" height="140" rx="24" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="2"/>
      <path d="M34 44 h72 a10 10 0 0 1 10 10 v34 a10 10 0 0 1 -10 10 h-40 l-22 20 v-20 h-10 a10 10 0 0 1 -10 -10 v-34 a10 10 0 0 1 10 -10 z" fill="#EEF0FF" stroke="#4F39F6" stroke-width="5"/>
    </g>
    <!-- healthcare -->
    <g transform="translate(830 100)">
      <rect width="140" height="140" rx="24" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="2"/>
      <path d="M70 112 C30 84 34 50 56 44 C68 40 70 52 70 56 C70 52 72 40 84 44 C106 50 110 84 70 112 Z" fill="#EEF0FF" stroke="#4F39F6" stroke-width="5"/>
    </g>
    <!-- code -->
    <g transform="translate(150 330)">
      <rect width="140" height="140" rx="24" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="2"/>
      <path d="M56 46 L34 70 L56 94 M84 46 L106 70 L84 94" fill="none" stroke="#4F39F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- transport -->
    <g transform="translate(910 330)">
      <rect width="140" height="140" rx="24" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="2"/>
      <rect x="34" y="52" width="72" height="40" rx="10" fill="#EEF0FF" stroke="#4F39F6" stroke-width="5"/>
      <circle cx="50" cy="98" r="9" fill="#4F39F6"/><circle cx="90" cy="98" r="9" fill="#4F39F6"/>
    </g>
    <!-- security -->
    <g transform="translate(360 520)">
      <rect width="140" height="140" rx="24" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="2"/>
      <path d="M70 34 L104 48 V78 C104 100 88 110 70 118 C52 110 36 100 36 78 V48 Z" fill="#EEF0FF" stroke="#4F39F6" stroke-width="5"/>
      <path d="M58 76 l9 9 l18 -20" fill="none" stroke="#4F39F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- analytics -->
    <g transform="translate(700 520)">
      <rect width="140" height="140" rx="24" fill="#FFFFFF" stroke="#C7CBFE" stroke-width="2"/>
      <g fill="#4F39F6"><rect x="40" y="78" width="16" height="30" rx="4"/><rect x="64" y="58" width="16" height="50" rx="4"/><rect x="88" y="42" width="16" height="66" rx="4"/></g>
    </g>
  </g>
</svg>
