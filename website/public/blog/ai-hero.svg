<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Abstract illustration of an artificial intelligence neural network">
  <defs>
    <linearGradient id="aihBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="0.55" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#E7ECFF"/>
    </linearGradient>
    <linearGradient id="aihCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DF8"/>
      <stop offset="1" stop-color="#3A20CE"/>
    </linearGradient>
    <radialGradient id="aihGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F39F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4F39F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#aihBg)"/>
  <circle cx="600" cy="338" r="300" fill="url(#aihGlow)"/>

  <!-- connective mesh -->
  <g stroke="#4F39F6" stroke-opacity="0.22" stroke-width="2" fill="none">
    <path d="M250 170 L470 230 L470 445 L250 505"/>
    <path d="M250 170 L470 445"/>
    <path d="M250 338 L470 230"/>
    <path d="M250 338 L470 445"/>
    <path d="M250 505 L470 230"/>
    <path d="M470 230 L730 145 L950 230"/>
    <path d="M470 230 L730 338 L950 445"/>
    <path d="M470 445 L730 338"/>
    <path d="M470 445 L730 530 L950 445"/>
    <path d="M730 145 L950 445"/>
    <path d="M730 530 L950 230"/>
  </g>

  <!-- outer nodes -->
  <g fill="#C7CBFE">
    <circle cx="250" cy="170" r="16"/>
    <circle cx="250" cy="338" r="16"/>
    <circle cx="250" cy="505" r="16"/>
    <circle cx="950" cy="230" r="16"/>
    <circle cx="950" cy="445" r="16"/>
    <circle cx="730" cy="145" r="14"/>
    <circle cx="730" cy="530" r="14"/>
  </g>
  <g fill="#8480F9">
    <circle cx="470" cy="230" r="20"/>
    <circle cx="470" cy="445" r="20"/>
    <circle cx="730" cy="338" r="22"/>
  </g>

  <!-- core "mind" -->
  <g transform="translate(600 338)">
    <circle r="118" fill="#FFFFFF"/>
    <circle r="96" fill="url(#aihCore)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-52 -6 q-4 -40 34 -44 q30 -4 34 26 q34 2 30 36 q22 16 4 40 q6 30 -26 32 q-8 26 -40 14 q-28 12 -40 -14 q-30 -6 -22 -38 q-18 -24 6 -42 q-6 -30 16 -36 z"/>
      <path d="M16 -60 v120 M16 -20 h34 M16 24 h-32"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="16" cy="-60" r="7"/>
      <circle cx="50" cy="-20" r="7"/>
      <circle cx="-16" cy="24" r="7"/>
      <circle cx="16" cy="60" r="7"/>
    </g>
  </g>

  <!-- floating accents -->
  <g fill="#4F39F6" fill-opacity="0.16">
    <rect x="120" y="70" width="26" height="26" rx="7"/>
    <rect x="1040" y="90" width="34" height="34" rx="9"/>
    <rect x="1000" y="560" width="24" height="24" rx="6"/>
    <rect x="150" y="580" width="30" height="30" rx="8"/>
  </g>
</svg>
