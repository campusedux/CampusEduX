name: Website CI

on:
  push:
    branches: ["**"]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      # next build is a meaningful gate for the deployable site. It needs no
      # real secrets: getPublicSupabase() returns null when the Supabase env is
      # unset and every page renders its empty/fallback state.
      - name: Build
        run: npm run build

  lighthouse:
    name: Lighthouse CI (performance budget)
    # PRs only — keeps the budget check off every branch push. The assertions
    # live in website/lighthouserc.json: `error` guards against regression,
    # `warn` tracks the aspirational CWV targets from the perf brief.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (no Supabase env — measures the shell + bundle)
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun

