name: Admin CI

on:
  push:
    branches: ["**"]
    paths:
      - "admin-panel/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    paths:
      - "admin-panel/**"
      - ".github/workflows/admin-ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      # next build is a meaningful gate for the deployable admin panel. It
      # needs no real secrets: every route here is cookie-driven (dynamic),
      # so build-time prerendering never calls the Supabase client.
      - name: Build
        run: npm run build
